name: Deploy Bildiagnos OS recovered full app and commercial preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e7ce0421a21a436f9ac46337ee2fd3f2a9794f6 # one work order per form, safe create retries
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build recovered root application (restore production app)

        run: npm run build
      - name: Preserve root site
        run: |
          mkdir -p site/commercial-preview
          cp -R dist/. site/
      - name: Build recovered commercial preview with correct asset paths
        run: VITE_BASE=/bildiagnos-os-v4/commercial-preview/ npm run build
      - name: Publish preview alongside root
        run: cp -R dist/. site/commercial-preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
