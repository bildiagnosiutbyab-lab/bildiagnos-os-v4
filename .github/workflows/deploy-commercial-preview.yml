name: Deploy commercial preview

on:
  push:
    branches: [integrate/v1-base-central-20260918, fix/ad-cart-import-20260927]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public-site
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          path: preview-site
      - name: Checkout isolated calendar test
        uses: actions/checkout@v4
        with:
          ref: feature/workshop-calendar-safe-20261012
          path: calendar-test-site
      - name: Checkout vehicle and reports test
        uses: actions/checkout@v4
        with:
          ref: feature/reuse-vehicle-customer-20261017
          path: orders-test-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            public-site/package-lock.json
            preview-site/package-lock.json
            orders-test-site/package-lock.json
            calendar-test-site/package-lock.json
      - run: npm ci --prefix public-site
      - run: npm run build --prefix public-site
      - run: npm ci --prefix preview-site
      - run: VITE_BASE=/bildiagnos-os-v4/commercial-preview/ npm run build --prefix preview-site
      - run: npm ci --prefix calendar-test-site
      - run: VITE_BASE=/bildiagnos-os-v4/calendar-test/ npm run build --prefix calendar-test-site
      - run: npm ci --prefix orders-test-site
      - run: VITE_BASE=/bildiagnos-os-v4/orders-test/ npm run build --prefix orders-test-site
      - name: Assemble public site and preview
        run: |
          mkdir -p site/commercial-preview site/calendar-test site/orders-test
          cp -R public-site/dist/. site/
          cp -R preview-site/dist/. site/commercial-preview/
          cp -R calendar-test-site/dist/. site/calendar-test/
          cp -R orders-test-site/dist/. site/orders-test/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

